[project]
name = "miam_agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-adk>=2.8.0",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
]

[tool.fastapi]
entrypoint = "app.adapters.inbound.web.app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=40",
]
